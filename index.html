.orb{position:relative;aspect-ratio:1;max-width:420px;margin:0 auto}
.orb .ring{position:absolute;border-radius:50%;border:1px solid var(--border);animation:spin 40s linear infinite}
.orb .r1{inset:6%;border-top-color:var(--violet2)}
.orb .r2{inset:18%;border-left-color:var(--soft);animation-duration:56s;animation-direction:reverse}

@keyframes spin{to{transform:rotate(360deg)}}

.count{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:28px;text-align:center}

const EVENT_MS = Date.UTC(2026, 8, 23, 21, 0, 0); // 24 Eylül 2026 00:00 Europe/Istanbul
let lang = localStorage.getItem("akay-lang") === "en" ? "en" : "tr";

function apply() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const v = T[lang][el.getAttribute("data-i18n")];
    if (v) el.textContent = v;
  });
  document.getElementById("langBtn").textContent = lang === "tr" ? "EN" : "TR";
  buildMenu();
}

function buildMenu() {
  const m = document.getElementById("mobileMenu");
  const open = m.classList.contains("open");
  m.innerHTML = "";
  document.querySelectorAll("#navLinks a").forEach((a) => {
    const c = a.cloneNode(true);
    c.addEventListener("click", () => toggleMenu(false));
    m.appendChild(c);
  });
  if (open) m.classList.add("open");
}

function toggleMenu(force) {
  const m = document.getElementById("mobileMenu");
  const next = typeof force === "boolean" ? force : !m.classList.contains("open");
  m.classList.toggle("open", next);
  document.getElementById("menuBtn").setAttribute("aria-expanded", String(next));
  document.body.style.overflow = next ? "hidden" : "";
}

function tick() {
  const diff = EVENT_MS - Date.now();
  const cd = document.getElementById("countdown");
  const st = document.getElementById("started");
  if (diff <= 0) { cd.style.display = "none"; st.style.display = "block"; return; }
  const s = Math.floor(diff / 1000);
  const p = (n) => String(n).padStart(2, "0");
  document.getElementById("cd-d").textContent = p(Math.floor(s / 86400));
  document.getElementById("cd-h").textContent = p(Math.floor((s % 86400) / 3600));
  document.getElementById("cd-m").textContent = p(Math.floor((s % 3600) / 60));
  document.getElementById("cd-s").textContent = p(s % 60);
}

document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "tr" ? "en" : "tr";
  localStorage.setItem("akay-lang", lang);
  apply();
});
document.getElementById("menuBtn").addEventListener("click", () => toggleMenu());

const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, { threshold: 0.15 });
document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

const sections = [...document.querySelectorAll("section[id]")];
const navMap = new Map([...document.querySelectorAll("#navLinks a")].map((a) => [a.getAttribute("href").slice(1), a]));
const spy = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    const a = navMap.get(e.target.id);
    if (a && e.isIntersecting) { navMap.forEach((l) => l.classList.remove("active")); a.classList.add("active"); }
  });
}, { rootMargin: "-45% 0px -50% 0px" });
sections.forEach((s) => spy.observe(s));

apply();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
